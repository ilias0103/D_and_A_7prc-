<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript практика</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
            background: #f5f5f5;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        button {
            padding: 10px 18px;
            margin: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #myButton {
            background: #333;
            color: white;
        }

        #backgroundButton {
            background: #ddd;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Интерактивная страница</h1>

        <button id="myButton">Нажми меня</button>
        <p id="text">Привет, мир!</p>

        <button id="backgroundButton">Изменить фон</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
